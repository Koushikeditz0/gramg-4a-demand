<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>G RAM-G 4A/Demand List Builder</title>
  <!-- The app now lives in ./v2/. This page only forwards there. -->
  <meta http-equiv="refresh" content="3; url=./v2/">
  <link rel="canonical" href="./v2/">
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#172033;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
    .box{background:#fff;border-radius:12px;padding:18px;max-width:420px;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:center;}
    a.btn{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none;}
    .small{font-size:12px;color:#64748b;margin-top:12px;}
  </style>
  <script>
    // Remove the old app's offline cache / service worker first (so phones do not keep
    // showing the old version), then open the new app. Never wait more than 1.5 s.
    (function () {
      var go = function () { location.replace('./v2/' + location.search + location.hash); };
      var jobs = [];
      try {
        if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.filter(function (r) { return !/\/v2\/$/.test(r.scope); }).map(function (r) { return r.unregister(); }));
        }));
        if (window.caches) jobs.push(caches.keys().then(function (k) {
          return Promise.all(k.filter(function (n) { return /^gramg-4a-demand-v1/.test(n); }).map(function (n) { return caches.delete(n); }));
        }));
      } catch (e) {}
      Promise.race([Promise.all(jobs).catch(function () {}), new Promise(function (r) { setTimeout(r, 1500); })]).then(go, go);
    })();
  </script>
</head>
<body>
  <div class="box">
    <div style="font-size:17px;font-weight:700;">📋 G RAM-G 4A/Demand List Builder</div>
    <div style="margin-top:8px;">নতুন app খুলছে...</div>
    <a class="btn" href="./v2/">নতুন app খুলুন</a>
    <div class="small">না খুললে উপরের বাটন চাপুন।</div>
  </div>
</body>
</html>
