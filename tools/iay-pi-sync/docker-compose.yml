services:
  iay-pi-sync:
    build: .
    image: iay-pi-sync:latest
    container_name: iay-pi-sync
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
